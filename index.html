<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jiggmaker · eufyMake E1</title>
    <script>
      (function () {
        try {
          if (localStorage.getItem("jiggmaker.theme") === "light") {
            document.documentElement.setAttribute("data-theme", "light");
          }
        } catch (e) {}
      })();
    </script>
    <style>
      html,
      body {
        background: #0f1419;
        color: #e8eef4;
      }
      html[data-theme="light"],
      html[data-theme="light"] body {
        background: #f4f6f8;
        color: #1a222c;
      }
    </style>
    <meta
      name="description"
      content="Genera jigs UV para eufyMake E1: Mini/Large, frame de alineación, DXF/SVG/STL y plantilla Studio."
    />

    />
  </head>
